# Source repo stays private. On every push to main: test, build, and push ONLY dist/
# to the public repo that GitHub Pages serves (default ingo-lab/ingo-lab.github.io).
#
# One-time setup (README "공개 배포"):
#   1. Create the public repo ingo-lab/ingo-lab.github.io (Pages: Deploy from branch main, / root)
#   2. Fine-grained token: that repo only, Contents = Read and write
#   3. Add it here as Actions secret PAGES_DEPLOY_TOKEN
#   Optional: Actions variable PAGES_REPO to target a different public repo.
name: deploy-public
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-public
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_REPO: ${{ vars.PAGES_REPO || 'ingo-lab/ingo-lab.github.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Fail clearly when the token is missing
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret PAGES_DEPLOY_TOKEN is not set (see README 공개 배포)."
            exit 1
          fi
      - name: Push dist/ to the public repo
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          SRC_SHA: ${{ github.sha }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${PAGES_REPO}.git" out
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. out/
          touch out/.nojekyll
          printf '# %s\n\nBuilt output of a private CV source repo. Do not edit here; changes are overwritten on every deploy.\n' "${PAGES_REPO#*/}" > out/README.md
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy."; exit 0; fi
          git commit -m "deploy: build from source ${SRC_SHA::7}"
          git push origin HEAD
