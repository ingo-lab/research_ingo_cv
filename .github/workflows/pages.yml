# Build cv.json (+ works synced from ORCID) -> dist/ and publish to GitHub Pages.
# Runs on every push to main, every day (ORCID sync), and on demand (Actions tab → Run workflow).
# One-time setup: repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC (12:17 KST)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync works from ORCID (keeps the previous data if ORCID or the network fails)
        continue-on-error: true
        run: node scripts/sync-orcid.mjs
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
